<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cartera Móvil</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; padding-top: 110px; color: #333; }
        
        /* Barra superior fija mejorada para mostrar Total y Rentabilidad Global */
        .header-fijo { position: fixed; top: 0; left: 0; right: 0; background: #1e293b; color: white; padding: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 1000; }
        .header-grid { display: flex; justify-content: space-around; align-items: center; margin-top: 5px; }
        .header-seccion { display: flex; flex-direction: column; }
        .header-titulo { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin: 0; }
        .header-total { font-size: 22px; font-weight: bold; color: #38bdf8; margin: 2px 0 0 0; }
        .header-rentabilidad { font-size: 16px; font-weight: bold; margin: 2px 0 0 0; }

        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 12px; display: flex; flex-direction: column; }
        .fondo-nombre { font-weight: bold; font-size: 16px; color: #0f172a; margin-bottom: 5px; }
        .fondo-ticker { font-size: 12px; color: #64748b; margin-bottom: 12px; }
        
        .datos-fila { display: flex; justify-content: space-between; font-size: 14px; margin: 4px 0; align-items: center; }
        .precio { font-weight: bold; color: #0f172a; }
        .valor-total-fondo { font-weight: bold; color: #1e293b; font-size: 15px; }
        
        /* Colores dinámicos para ganancias/pérdidas */
        .positivo { color: #059669 !important; }
        .negativo { color: #dc2626 !important; }
        .neutro { color: #64748b !important; }
        
        /* Estilos para los cuadros de texto */
        .inputs-contenedor { display: flex; gap: 10px; justify-content: space-between; margin: 8px 0; }
        .input-grupo { display: flex; flex-direction: column; width: 48%; }
        .input-label { font-size: 11px; color: #64748b; margin-bottom: 4px; }
        .input-cartera { width: 100%; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; text-align: right; color: #334155; box-sizing: border-box; }
        .input-cartera:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }

        .actualizando { text-align: center; color: #64748b; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header-fijo">
        <div class="header-grid">
            <div class="header-seccion">
                <p class="header-titulo">Valor Actual</p>
                <p class="header-total" id="gran-total">0,00 €</p>
            </div>
            <div class="header-seccion" style="border-left: 1px solid #334155; padding-left: 20px;">
                <p class="header-titulo">Ganancia Total</p>
                <p class="header-rentabilidad neutro" id="gran-rentabilidad">0,00 € (0,00%)</p>
            </div>
        </div>
    </div>

    <div id="loading" class="actualizando">Cargando precios...</div>
    <div id="contenedor-fondos"></div>

    <script>
        const URL_CSV = "https://raw.githubusercontent.com/josemiii19/mi-cartera-web/main/precios_actuales_fondos.csv";
        let fondosDatos = [];

        function limpiarNumeroEspanyol(texto) {
            if (!texto) return 0;
            let limpio = texto.replace(/\./g, "").replace(",", ".");
            return parseFloat(limpio) || 0;
        }

        function formatearMoneda(valor) {
            return new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(valor);
        }

        function formatearPorcentaje(valor) {
            return new Intl.NumberFormat('es-ES', { style: 'percent', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(valor / 100);
        }

        async function cargarCartera() {
            try {
                const respuesta = await fetch(URL_CSV, { cache: "no-store" });
                if (!respuesta.ok) throw new Error("No se pudo obtener el archivo");
                
                const textoCsv = await respuesta.text();
                document.getElementById("loading").style.display = "none";
                
                const lineas = textoCsv.split("\n").filter(l => l.trim() !== "");
                const contenedor = document.getElementById("contenedor-fondos");
                
                for (let i = 1; i < lineas.length; i++) {
                    const columnas = lineas[i].split(";");
                    if (columnas.length < 4) continue;
                    
                    const ticker = columnas[0].trim();
                    const nombre = columnas[1].trim();
                    const precioTexto = columnas[2].trim();
                    const fecha = columnas[3].trim();
                    
                    const precioNum = limpiarNumeroEspanyol(precioTexto);
                    
                    // Recuperamos los datos guardados en el almacenamiento del móvil
                    const partGuardadas = localStorage.getItem(`part_${ticker}`) || "0";
                    const precioMedioGuardado = localStorage.getItem(`pmc_${ticker}`) || "0";

                    fondosDatos.push({ ticker, nombre, precioNum, precioTexto, fecha });

                    const htmlCard = `
                        <div class="card" id="card-${ticker}">
                            <div class="fondo-nombre">${nombre}</div>
                            <div class="fondo-ticker">${ticker}</div>
                            
                            <div class="datos-fila">
                                <span>Precio de Mercado:</span>
                                <span class="precio">${precioTexto} €</span>
                            </div>
                            
                            <div class="inputs-contenedor">
                                <div class="input-grupo">
                                    <span class="input-label">Participaciones</span>
                                    <input type="number" step="any" inputmode="decimal" class="input-cartera" id="input-part-${ticker}" value="${partGuardadas}" oninput="calcularTotales()">
                                </div>
                                <div class="input-grupo">
                                    <span class="input-label">Precio Medio Compra (€)</span>
                                    <input type="number" step="any" inputmode="decimal" class="input-cartera" id="input-pmc-${ticker}" value="${precioMedioGuardado}" oninput="calcularTotales()">
                                </div>
                            </div>
                            
                            <div class="datos-fila" style="border-top: 1px dashed #e2e8f0; margin-top: 6px; padding-top: 8px;">
                                <span>Valor de tu posición:</span>
                                <span class="valor-total-fondo" id="valor-total-${ticker}">0,00 €</span>
                            </div>

                            <div class="datos-fila">
                                <span>Rentabilidad:</span>
                                <span id="rentabilidad-${ticker}" class="neutro" style="font-weight: bold;">0,00 € (0,00%)</span>
                            </div>
                            
                            <div class="datos-fila" style="font-size: 11px; color: #94a3b8; margin-top: 4px;">
                                <span>Fecha Valor:</span>
                                <span>${fecha}</span>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += htmlCard;
                }

                calcularTotales();

            } catch (error) {
                document.getElementById("loading").innerText = "❌ Error al cargar los datos.";
                console.error(error);
            }
        }

        function calcularTotales() {
            let granTotalActual = 0;
            let granTotalInvertido = 0;

            fondosDatos.forEach(fondo => {
                const inputPart = document.getElementById(`input-part-${fondo.ticker}`);
                const inputPmc = document.getElementById(`input-pmc-${fondo.ticker}`);
                
                let participaciones = parseFloat(inputPart.value.replace(",", ".")) || 0;
                let pmc = parseFloat(inputPmc.value.replace(",", ".")) || 0;

                // 1. Guardamos de forma persistente ambos inputs en el móvil
                localStorage.setItem(`part_${fondo.ticker}`, inputPart.value);
                localStorage.setItem(`pmc_${fondo.ticker}`, inputPmc.value);

                // 2. Operaciones matemáticas básicas
                let valorActualPosicion = participaciones * fondo.precioNum;
                let capitalInvertidoPosicion = participaciones * pmc;
                let plusvaliaPosicion = valorActualPosicion - capitalInvertidoPosicion;
                
                let porcentajePosicion = 0;
                if (capitalInvertidoPosicion > 0) {
                    porcentajePosicion = (plusvaliaPosicion / capitalInvertidoPosicion) * 100;
                }

                granTotalActual += valorActualPosicion;
                granTotalInvertido += capitalInvertidoPosicion;

                // 3. Renderizar resultados individuales del fondo con colores dinámicos
                document.getElementById(`valor-total-${fondo.ticker}`).innerText = formatearMoneda(valorActualPosicion);
                
                const textoRentabilidad = `${formatearMoneda(plusvaliaPosicion)} (${plusvaliaPosicion >= 0 ? '+' : ''}${formatearPorcentaje(porcentajePosicion)})`;
                const elementoRentabilidad = document.getElementById(`rentabilidad-${fondo.ticker}`);
                elementoRentabilidad.innerText = textoRentabilidad;

                // Aplicar color según rendimiento
                if (plusvaliaPosicion > 0) {
                    elementoRentabilidad.className = "positivo";
                } else if (plusvaliaPosicion < 0) {
                    elementoRentabilidad.className = "negativo";
                } else {
                    elementoRentabilidad.className = "neutro";
                }
            });

            // 4. Calcular y renderizar el Marcador Global de la barra superior
            document.getElementById("gran-total").innerText = formatearMoneda(granTotalActual);
            
            let granPlusvalia = granTotalActual - granTotalInvertido;
            let granPorcentaje = 0;
            if (granTotalInvertido > 0) {
                granPorcentaje = (granPlusvalia / granTotalInvertido) * 100;
            }

            const elementoGranRentabilidad = document.getElementById("gran-rentabilidad");
            elementoGranRentabilidad.innerText = `${formatearMoneda(granPlusvalia)} (${granPlusvalia >= 0 ? '+' : ''}${formatearPorcentaje(granPorcentaje)})`;
            
            if (granPlusvalia > 0) {
                elementoGranRentabilidad.className = "header-rentabilidad positivo";
            } else if (granPlusvalia < 0) {
                elementoGranRentabilidad.className = "header-rentabilidad negativo";
            } else {
                elementoGranRentabilidad.className = "header-rentabilidad neutro";
            }
        }

        cargarCartera();
    </script>
</body>
</html>
